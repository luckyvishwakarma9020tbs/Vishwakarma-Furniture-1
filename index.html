const fmtn=n=>(+n.toFixed(6)).toLocaleString('en-IN',{maximumFractionDigits:6});
function ev(s){if(!s||/[+−×÷.]$/.test(s))return null;const t=s.match(/\d*\.?\d+|[+−×÷]/g)||[];if(t[0]=='−'){t.shift();t[0]='-'+t[0]}const a=[+t[0]];if(isNaN(a[0]))return null;for(let i=1;i<t.length;i+=2){const o=t[i],n=+t[i+1];if(isNaN(n))return null;if(o=='×')a[a.length-1]*=n;else if(o=='÷')a[a.length-1]/=n;else a.push(o,n)}let r=a[0];for(let i=1;i<a.length;i+=2)r+=a[i]=='+'?a[i+1]:-a[i+1];return isFinite(r)?r:null}
let ce='',hs=[],fr=false,cmode='n';
const OPS='+−×÷',strip=s=>s.replace(/[+−×÷.]$/,'');
function kp(k){if(fr&&/^[\d.]+$/.test(k))ce='';fr=false;
if(k=='C')ce='';else if(k=='⌫')ce=ce.slice(0,-1);
else if(k=='='){const v=ev(strip(ce));if(v!==null){hs.unshift(ce+' = '+fmtn(v));hs.length=Math.min(hs.length,6);ce=String(+v.toFixed(8)).replace('-','−');fr=true}}
else if(k=='%'){const m=ce.match(/^(.+)([+−])([\d.]+)$/);if(m){const l=ev(m[1]);if(l!==null)ce=m[1]+m[2]+String(+(l*m[3]/100).toFixed(8))}else{const m2=ce.match(/^(.*?)([\d.]+)$/);if(m2)ce=m2[1]+String(+(m2[2]/100).toFixed(8))}}
else if(OPS.includes(k)){if(ce&&!OPS.includes(ce.slice(-1)))ce+=k;else if(ce.length>1)ce=ce.slice(0,-1)+k;else if(k=='−'&&!ce)ce='−'}
else if(k=='.'){if(!(ce.match(/[\d.]*$/)[0]).includes('.'))ce+=ce&&!OPS.includes(ce.slice(-1))?'.':'0.'}
else ce+=k;kr()}
function kr(){const x=$('#cx');if(!x)return;x.textContent=ce||'\u00a0';const v=ev(strip(ce));$('#cr').textContent=v!==null?fmtn(v):'0';$('#ch').innerHTML=hs.map(h=>`<div class="mut" style="padding:3px 0">${h}</div>`).join('')||'<div class="mut">Abhi koi hisaab nahi.</div>'}
function nc(){setTimeout(kr,0);return`<div class="cd"><div class="x" id="cx"></div><div class="r" id="cr">0</div></div><div class="ck">${['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','00','0','.','='].map(k=>`<button class="${OPS.includes(k)||k=='%'?'o':k=='='?'e':''}" onclick="kp('${k}')">${k}</button>`).join('')}</div><div class="card" style="margin-top:12px"><h3>Pichhle hisaab</h3><div id="ch"></div></div>`}
function pl(){setTimeout(plr,0);const i=(id,l)=>`<div><label>${l}</label><input id="${id}" type="number" inputmode="decimal" oninput="plr()"></div>`;return`<div class="card"><h3>Profit / Loss nikalo</h3><div class="g2">${i('pc','Lagat (Cost) ₹')}${i('ps','Bikri (Selling) ₹')}</div><div class="big" style="margin:12px 0 0"><div class="l" id="pl1">Dono rate daalo</div><div class="n" id="pl2">—</div><div class="l" id="pl3"></div></div></div>

function plr(){const g=i=>{const e=$('#'+i);return e&&e.value!==''?+e.value:null},m=n=>'₹'+fmtn(n),c=g('pc'),s=g('ps');
if($('#pl2')){if(c!==null&&s!==null){const d=s-c;$('#pl1').textContent=d>=0?'✅ Profit':'🔻 Loss';$('#pl2').textContent=m(Math.abs(d));$('#pl3').textContent='Lagat par '+(c?Math.abs(d/c*100).toFixed(2):0)+'% · Bikri par '+(s?Math.abs(d/s*100).toFixed(2):0)+'%'}else{$('#pl1').textContent='Dono rate daalo';$('#pl2').textContent='—';$('#pl3').textContent=''}}

function ask(m,fn,back){sheet(`<h2>Pakka?</h2><div class="mut" style="margin:6px 0 14px">${m}</div><div class="g2"><button class="gh" onclick="${back||'closeS()'}">Nahi</button><button class="am" style="background:var(--bad);color:#fff" onclick="${fn}">Haan</button></div>`)}

function askDel(k,id){const o=(k=='l'?S.labour:S.clients).find(x=>x.id==id),b=k=='l'?`openL(${id})`:`openC(${id})`;ask(k=='l'?`<b>${esc(o.name)}</b> ka poora record (attendance, payment, site history) delete ho jayega.`:`<b>${esc(o.name)}</b> ki site aur uski payments delete ho jayengi. Is site ke labour free ho jayenge.`,`doDel('${k}',${id})`,b)}
function doDel(k,id){if(k=='l')S.labour=S.labour.filter(x=>x.id!=id);else{S.clients=S.clients.filter(x=>x.id!=id);S.labour.forEach(l=>{if(l.site==id){closeH(l,today());l.site=null}})}save();closeS()}
function delPay(k,id,i){ask('Ye payment entry delete hogi.',`doPay('${k}',${id},${i})`,k=='l'?`openL(${id})`:`openC(${id})`)}
function doPay(k,id,i){(k=='l'?S.labour:S.clients).find(x=>x.id==id).pay.splice(i,1);save();k=='l'?openL(id):openC(id)}
function dataCard(){return`<div class="card"><h2>\U0001F4BE Backup &amp; Data</h2><div class="mut" style="margin-bottom:10px">Sara data isi phone me hai. ${S.bk?'Last backup: '+S.bk:'Abhi tak backup nahi liya.'}</div><div class="g2"><button onclick="bk()">\u2B07 Backup lo</button><button class="gh" onclick="$('#rf').click()">\u2B06 Restore karo</button></div><input id="rf" type="file" accept=".json,application/json" style="display:none" onchange="rs(this)"><button class="gh full" style="margin-top:10px;color:var(--bad)" onclick="ask('Sara data (labour, site, payment, quotation) hamesha ke liye delete ho jayega. Pehle backup le lo.','wipe()')">\U0001F5D1 Sara data delete karo</button></div>`}
async function bk(){const data=JSON.stringify(S,null,1),fn='Vishwakarma-backup-'+today()+'.json';try{const dl=window.claude?await claude.use('downloads'):null;if(dl)await dl.save({filename:fn,data});else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=fn;document.body.appendChild(a);a.click();a.remove()}S.bk=today();save();render()}catch(e){if(!e||e.code!=='declined')msg('Backup save nahi hua.')}}
let pend=null;
function rs(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.labour)||!Array.isArray(d.clients))throw 0;d.quotes=d.quotes||[];pend=d;ask('Backup file ('+d.labour.length+' labour, '+d.clients.length+' site, '+d.quotes.length+' quotation) restore hogi. Abhi ka data badal jayega.','doRs()')}catch(e){msg('Ye sahi backup file nahi hai.')}};r.readAsText(f)}
function doRs(){S=pend;S.labour.forEach(l=>{if(!l.hist)l.hist=[{site:l.site,from:l.since,to:null}]});save();closeS()}
function wipe(){S={labour:[],clients:[],quotes:[]};save();closeS()}
function cnt(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;document.querySelectorAll('.big .n,.tile .n').forEach(e=>{const t=e.textContent,p=t[0]=='₹'?'₹':'',v=+t.replace(/[^\d]/g,''),s=performance.now();(function f(n){const k=Math.min(1,(n-s)/700);e.textContent=p+Math.round(v*(1-Math.pow(1-k,3))).toLocaleString('en-IN');if(k<1)requestAnimationFrame(f)})(s)})}
render();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
